name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # hub 和主题收录站都要求 theme.json 的 version 与 tag 一致，不一致就别发布。
      - name: Check version matches tag
        run: |
          THEME=$(node -p 'require("./theme.json").version')
          PKG=$(node -p 'require("./package.json").version')
          [ "$THEME" = "$PKG" ] || { echo "::error::theme.json $THEME, package.json $PKG"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "$GITHUB_REF_NAME" = "v$THEME" ] || { echo "::error::tag $GITHUB_REF_NAME, theme.json v$THEME"; exit 1; }
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run package
      - run: sha256sum theme.tar.gz | cut -d' ' -f1 | tee theme.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: monitor-theme-luminaplus
          path: |
            theme.tar.gz
            theme.tar.gz.sha256
            preview.png
      # 在网页上先建好 Release 再推 tag(或网页建 Release 时顺手建 tag)时，Release 已经存在：
      # 这时只补传主题包，覆盖同名文件，不再因为「already exists」失败。
      - if: startsWith(github.ref, 'refs/tags/')
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" theme.tar.gz theme.tar.gz.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" theme.tar.gz theme.tar.gz.sha256 --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
